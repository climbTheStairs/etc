# Keybindings testing mode: mpv --input-test --idle --force-window

#########
# BASIC #
#########
MBTN_LEFT ignore # suppress console warnings

'      quit
Ctrl+w quit
Ctrl+c quit
"      quit-watch-later
Ctrl+q quit-watch-later

MBTN_RIGHT cycle pause
SPACE      cycle pause
PLAYPAUSE  cycle pause

LEFT        seek -5
RIGHT       seek +5
d           seek -5
n           seek +5
Shift+LEFT  no-osd seek -1
Shift+RIGHT no-osd seek +1
D           no-osd seek -1
N           no-osd seek +1
g           revert-seek

MBTN_LEFT_DBL  cycle fullscreen
MBTN_RIGHT_DBL cycle ontop
u              cycle fullscreen
ESC            set fullscreen no

/ add speed -0.25
= add speed +0.25
? add speed -1
+ add speed +1

WHEEL_UP   add volume +5
WHEEL_DOWN add volume -5
UP         add volume +5
DOWN       add volume -5
t          add volume +5
h          add volume -5
m          cycle mute

a cycle audio up
A cycle audio down
o cycle sub   up
O cycle sub   down
k cycle video up
K cycle video down
c show_text ${track-list}
C script-binding stats/display-stats-toggle

l            show_text ${playlist}
TAB          playlist-next
Shift+TAB    playlist-prev
ENTER        playlist-next
W            playlist-prev
V            playlist-next
NEXT         playlist-next
PREV         playlist-prev
MBTN_BACK    playlist-prev # Missing
MBTN_FORWARD playlist-next # Missing
z            playlist-shuffle;   show_text "Shuffled"
Z            playlist-unshuffle; show_text "Unshuffled"
Alt+l        cycle-values loop-file     "inf" "no"
Alt+L        cycle-values loop-playlist "inf" "no"

############
# ENHANCED #
############
[ add brightness -10
] add brightness +10
{ add contrast   -10
} add contrast   +10

r no-osd cycle-values osd-level 3 1
v frame-step
w frame-back-step
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent
0 seek  0 absolute-percent

Ctrl+WHEEL_UP   add video-zoom +0.1
Ctrl+WHEEL_DOWN add video-zoom -0.1
Ctrl+=          add video-zoom +0.1
Ctrl+-          add video-zoom -0.1
Ctrl+LEFT       add video-pan-x +0.1
Ctrl+DOWN       add video-pan-y -0.1
Ctrl+UP         add video-pan-y +0.1
Ctrl+RIGHT      add video-pan-x -0.1
Ctrl+h          add video-pan-x +0.1
Ctrl+j          add video-pan-y -0.1
Ctrl+k          add video-pan-y +0.1
Ctrl+l          add video-pan-x -0.1

Ctrl+s     screenshot video
Ctrl+Alt+s screenshot each-frame

x cycle border

BS set speed 1; set volume 100; set video-zoom 0; set video-pan-x 0; set video-pan-y 0; set border no

##################
# UNKNOWN INPUTS #
##################
POWER       quit;          show_text "Input: POWER"
PLAY        cycle pause;   show_text "Input: PLAY"
PAUSE       cycle pause;   show_text "Input: PAUSE"
PLAYONLY    set pause no;  show_text "Input: PLAYONLY"
PAUSEONLY   set pause yes; show_text "Input: PAUSEONLY"
STOP        quit;          show_text "Input: STOP"
FORWARD     seek +60;      show_text "Input: FORWARD"
REWIND      seek -60;      show_text "Input: REWIND"
VOLUME_UP   add volume 2;  show_text "Input: VOLUME_UP"
VOLUME_DOWN add volume -2; show_text "Input: VOLUME_DOWN"
MUTE        cycle mute;    show_text "Input: MUTE"
CLOSE_WIN   quit;          show_text "Input: CLOSE_WIN"

#####################
# UNCERTAIN OUTPUTS #
#####################
# Alt+s add sub-pos -1
# Alt+S add sub-pos +1
# U add sub-scale +0.1
# I add sub-scale -0.1

# > cycle edition
# E cycle deinterlace
# DEL ignore # default script-binding osc/visibility
PGUP  add chapter +1
PGDWN add chapter -1

